name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          cache: true
          install: false
          runtime: node@24.16.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.109.1

      - name: Configure isolated test database
        id: configure-db
        run: node scripts/configure-ci-database.mjs

      - name: Start migrated test database
        run: supabase db start

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and BDD tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check shared dropdown visuals
        id: visual-check
        run: |
          node scripts/visual-select-server.mjs &
          fixture_pid=$!
          trap 'kill "$fixture_pid"' EXIT
          curl --retry 30 --retry-connrefused --retry-delay 1 --max-time 2 --fail --silent http://127.0.0.1:8770/ > /dev/null
          docker run --rm --network host --ipc host \
            -e CI=true -e VISUAL_BASE_URL=http://127.0.0.1:8770 \
            -v "$PWD:/work" -w /work \
            mcr.microsoft.com/playwright:v1.64.0-noble@sha256:06a9939e57531807f8d5fd76ce44b53165ffb7d7501d87ab10e285c20b1e971f \
            node node_modules/@playwright/test/cli.js test

      - name: Upload visual failure screenshots and traces
        if: ${{ failure() && steps.visual-check.outcome == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dropdown-visual-failures
          path: test-results/
          retention-days: 7

      - name: Stop isolated test database
        if: ${{ always() && steps.configure-db.outcome == 'success' }}
        run: supabase stop --project-id "$CI_SUPABASE_PROJECT_ID" --no-backup --yes

  coverage:
    name: Integration and coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          cache: true
          install: false
          runtime: node@24.16.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@3c2f5e2ae34c34e428e8e206e2c4d21fa2d20fbf # v2.1.1
        with:
          version: 2.109.1

      - name: Configure isolated test database
        id: configure-db
        run: node scripts/configure-ci-database.mjs

      - name: Start migrated test database
        run: supabase db start

      - name: Run integration tests with coverage
        run: pnpm test:coverage

      - name: Run API and action contract tests
        run: pnpm test:contract

      - name: Stop isolated test database
        if: ${{ always() && steps.configure-db.outcome == 'success' }}
        run: supabase stop --project-id "$CI_SUPABASE_PROJECT_ID" --no-backup --yes

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Provide non-secret local environment
        run: cp .env.example .env

      - name: Validate Compose
        run: docker compose --profile local config --quiet

      - name: Build application image
        run: docker compose --profile local build app-local

      - name: Set up Node.js for migration checks
        uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with:
          install: false
          runtime: node@24.16.0

      - name: Verify CLI migrations on fresh and existing databases
        run: node scripts/test-migrations.mjs
