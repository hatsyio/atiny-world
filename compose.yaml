name: atiny-world

x-app: &app
    build:
      context: .
      target: development
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/api/health')
          .then((response) => process.exit(response.ok ? 0 : 1))
          .catch(() => process.exit(1))
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 20s

services:
  app-local:
    <<: *app
    profiles: [local]
    env_file:
      - .env
    volumes:
      - .:/app
      - /dev/null:/app/.env.pro:ro
      - node_modules:/app/node_modules
      - next_cache:/app/.next
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully

  app-pro:
    <<: *app
    profiles: [pro]
    env_file:
      - .env
      - .env.pro
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
      SUPABASE_DB_PASSWORD: ""
    volumes:
      - node_modules:/app/node_modules
      - next_cache:/app/.next

  db:
    profiles: [local]
    build:
      context: .
      dockerfile: docker/Postgres.Dockerfile
    image: atiny-world-postgres:17.6-postgis
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "127.0.0.1:54332:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  migrate:
    profiles: [local]
    image: atiny-world-postgres:17.6-postgis
    entrypoint: ["/bin/sh", "/migrate.sh"]
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./docker/migrate.sh:/migrate.sh:ro
      - ./supabase/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  next_cache:
  node_modules:
  postgres_data:
